name: Idea or improvement
description: Propose a change to a step, the flow, or the core.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow or impossible today, and for whom? Evidence beats opinion.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you change? If it alters a design decision, say which ADR.
  - type: textarea
    id: measure
    attributes:
      label: How we would know it worked
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
