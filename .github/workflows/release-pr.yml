name: Release pull request

# Opens the pull request that carries a release: the package version and the
# regenerated changelog, after the full gate. Merging it starts release.yml,
# which still waits for the protected release environment before publishing.
# The repository must allow GitHub Actions to create pull requests.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release, such as 1.0.0-rc.1 or 1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  open:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run build
      - name: Set the version and regenerate the changelog
        run: node scripts/release.mjs bump "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: npm run check
      - name: Commit through the API and open the pull request
        run: node scripts/release.mjs open-pr "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
