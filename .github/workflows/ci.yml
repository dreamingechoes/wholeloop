name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · ${{ matrix.os }} · node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Commit hygiene checks every PR commit, including fork PRs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  runtime:
    name: runtime · ubuntu-latest · node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: The bundled CLI runs on the oldest supported Node
        # Build before switching Node: runtime checks must not invoke development tooling.
        run: |
          node --version
          npm run smoke
          node scripts/check-package.mjs
          node dist/wl.mjs docs check
          node dist/wl.mjs harness check
          node dist/wl.mjs eval definitions test/evals/definition/corpus.json --json
          node dist/wl.mjs eval gates test/evals/gates/corpus.json --predictions test/evals/gates/baseline-predictions.json --json
          node dist/wl.mjs eval grounding test/evals/grounding/corpus.json --json
