name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · ${{ matrix.os }} · node 22
    runs-on: ${{ matrix.os }}
    # macOS runners have no Docker, so its tests skip there; on Ubuntu they run and
    # the full gate exceeded ten minutes (first hosted run, 2026-11-08).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Commit hygiene checks every PR commit, including fork PRs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Nothing is a runtime dependency: the CLI bundles its packages from
      # devDependencies, so the audit targets what the bundle contains (P7-05).
      - name: Audit bundled dependencies and licences
        run: node scripts/check-dependencies.mjs --audit
      # An empty cache, not the one restored by setup-node: with the restored
      # cache npm reported EMISSINGSIGNATUREKEY for magic-string 1.4.5 on both of
      # two attempts twenty seconds apart, while the same npm 10.9.9 verifies it
      # locally with a fresh or a warm cache and the registry lists its key.
      - name: Verify registry signatures and provenance of installed packages
        run: npm audit signatures --cache "$RUNNER_TEMP/npm-audit-cache"

  runtime:
    name: runtime · ubuntu-latest · node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: The bundled CLI runs on the oldest supported Node
        # Build before switching Node: runtime checks must not invoke development tooling.
        run: |
          node --version
          npm run smoke
          node scripts/check-package.mjs
          node dist/wl.mjs docs check
          node dist/wl.mjs harness check
          node dist/wl.mjs eval definitions test/evals/definition/corpus.json --json
          node dist/wl.mjs eval gates test/evals/gates/corpus.json --predictions test/evals/gates/baseline-predictions.json --json
          node dist/wl.mjs eval grounding test/evals/grounding/corpus.json --json
