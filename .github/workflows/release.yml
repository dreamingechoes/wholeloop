name: Release

# A release starts when a merged release pull request changes the package
# version to an untagged one (see release-pr.yml), or from an explicit
# dispatch. Either way publication waits for the protected release
# environment, the only manual step, and publishes the prepared bytes.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in package.json and package-lock.json
        required: true
        type: string
      from:
        description: Previous release ref, or empty for the first release
        required: false
        type: string
      publish:
        description: Publish this prepared bundle after the protected release environment approves it
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      from: ${{ steps.plan.outputs.from }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Decide whether this run releases and which range it covers
        id: plan
        run: node scripts/release.mjs plan
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_FROM: ${{ inputs.from }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_BEFORE: ${{ github.event.before }}

  prepare:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run check
      - name: Observe actual repository and event metadata
        run: node scripts/release.mjs context "$RUNNER_TEMP/release-context.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Describe the bundled packages
        run: node scripts/check-dependencies.mjs --sbom "$RUNNER_TEMP/sbom.cdx.json"
      - name: Prepare and verify exact release payloads
        id: bundle
        run: node scripts/release.mjs prepare "$RELEASE_VERSION" "$RUNNER_TEMP/release-context.json" "$RUNNER_TEMP/release-bundle" "$RELEASE_FROM"
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_FROM: ${{ needs.plan.outputs.from }}
          RELEASE_SBOM: ${{ runner.temp }}/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-${{ github.sha }}
          path: ${{ steps.bundle.outputs.bundle }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record the concrete approval inputs
        run: node scripts/release-summary.mjs
        env:
          RELEASE_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RELEASE_MANIFEST_SHA256: ${{ steps.bundle.outputs.sha256 }}
          RELEASE_PUBLISH_REQUESTED: ${{ needs.plan.outputs.publish }}

  publish:
    needs: [plan, prepare]
    if: needs.plan.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/release-bundle
          merge-multiple: true
          digest-mismatch: error
      - name: Refresh actual repository and event metadata
        run: node scripts/release.mjs context "$RUNNER_TEMP/release-context.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify reviewed bytes, publish with OIDC and finalize the release
        run: node scripts/release.mjs publish "$RUNNER_TEMP/release-bundle" "$RELEASE_MANIFEST_SHA256" "$RUNNER_TEMP/release-context.json"
        env:
          RELEASE_MANIFEST_SHA256: ${{ needs.prepare.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}

  # A clean runner on the oldest supported Node installs what users get from
  # the registry; nothing from the checkout but the script itself is used.
  verify:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install the published version and run it
        run: node scripts/release.mjs verify-published "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}

  mark-failed:
    needs: [plan, publish, verify]
    if: always() && needs.publish.result == 'success' && needs.verify.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Mark the release as failed and link the recovery procedure
        run: node scripts/release.mjs mark-failed "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
