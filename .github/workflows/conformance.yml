name: Nightly conformance

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance
  cancel-in-progress: false

env:
  CONFORMANCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  core:
    if: vars.WHOLELOOP_CONFORMANCE_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.core.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - id: core
        run: node scripts/conformance-nightly.mjs core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: conformance-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/wl.mjs
          if-no-files-found: error
          retention-days: 7

  observe:
    needs: core
    runs-on: ubuntu-latest
    environment: conformance
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { cli: claude, key: WL_CONFORMANCE_CLAUDE_KEY }
          - { cli: codex, key: WL_CONFORMANCE_CODEX_KEY }
          - { cli: opencode, key: WL_CONFORMANCE_OPENCODE_KEY }
          - { cli: copilot, key: WL_CONFORMANCE_COPILOT_TOKEN }
          - { cli: gemini, key: WL_CONFORMANCE_GEMINI_KEY }
          - { cli: antigravity, key: WL_CONFORMANCE_ANTIGRAVITY_KEY }
          - { cli: cursor, key: WL_CONFORMANCE_CURSOR_KEY }
    env:
      CONFORMANCE_CORE_SHA256: ${{ needs.core.outputs.sha256 }}
      CONFORMANCE_TARGET: ${{ matrix.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
      # Use the npm bundled with this exact Node (ADR-0069): a global npm install is not
      # pinned by hash. Fail rather than run with a different npm.
      - run: test "$(npm --version)" = 11.19.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core.outputs.artifact }}
          path: dist
          digest-mismatch: error
      - name: Install only the selected native channels without model credentials
        run: node scripts/conformance-provision.mjs --target "$CONFORMANCE_TARGET" --install "$RUNNER_TEMP/native"
      - name: Observe two fresh channels with only the selected credential
        run: node scripts/conformance-nightly.mjs collect "$CONFORMANCE_TARGET" "$RUNNER_TEMP/native" "$RUNNER_TEMP/observations"
        env:
          CONFORMANCE_NATIVE_KEY: ${{ secrets[matrix.key] }}
          CONFORMANCE_NATIVE_MODEL: ${{ vars.WHOLELOOP_CONFORMANCE_OPENCODE_MODEL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.cli }}
          path: |
            ${{ runner.temp }}/observations/results.json
            ${{ runner.temp }}/observations/receipt.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [core, observe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.aggregate.outputs.sha256 }}
    env:
      CONFORMANCE_CORE_SHA256: ${{ needs.core.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core.outputs.artifact }}
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: observations-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/client-artifacts
          digest-mismatch: error
      - id: aggregate
        run: node scripts/conformance-nightly.mjs aggregate "$RUNNER_TEMP/client-artifacts" "$RUNNER_TEMP/conformance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: error
          retention-days: 7
      - name: Add the structural matrix to the run summary
        run: cat "$RUNNER_TEMP/conformance/matrix.md" >> "$GITHUB_STEP_SUMMARY"

  issues:
    needs: [core, aggregate]
    if: vars.WHOLELOOP_CONFORMANCE_ISSUES == 'true'
    runs-on: ubuntu-latest
    environment: conformance-issues
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: conformance-issues
      cancel-in-progress: false
    env:
      CONFORMANCE_CORE_SHA256: ${{ needs.core.outputs.sha256 }}
      CONFORMANCE_RESULTS_SHA256: ${{ needs.aggregate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core.outputs.artifact }}
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.aggregate.outputs.artifact }}
          path: ${{ runner.temp }}/conformance
          digest-mismatch: error
      - name: Verify exact transferred observations before service access
        run: node scripts/conformance-nightly.mjs verify-results "$RUNNER_TEMP/conformance/results.json" "$CONFORMANCE_RESULTS_SHA256"
      - name: Deliver only current comparable structural issues
        run: node scripts/conformance-issues.mjs "$RUNNER_TEMP/conformance/results.json" --write
        env:
          GH_TOKEN: ${{ github.token }}
