# Weekly update proposals for npm and the SHA-pinned GitHub Actions (P7-05).
# Dependabot only opens pull requests; each one passes the same gate as any
# other change, including the bundled-dependency licence check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Node types follow the oldest supported runtime (20 for the CLI, 22 for
    # development), not the newest Node; a major bump fails the typecheck.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
