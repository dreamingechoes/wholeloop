# Weekly update proposals for npm and the SHA-pinned GitHub Actions (P7-05).
# Dependabot only opens pull requests; each one passes the same gate as any
# other change, including the bundled-dependency licence check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
