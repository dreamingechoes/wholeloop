# Every hard rule (a line with ⛔ `rule-id`) in harness/ must be listed here with what enforces it.
# An enforcer is code, a test or a lint: `path` or `path#symbol`. Markdown is never an enforcer.
# `forbid` lists regexes that must not appear in harness sources (a skill contradicting the rule).
# Checked by `wl harness check` — see docs/decisions/0011-size-budgets-and-enforcement.md.
version: 1
rules:
  - id: gate-deterministic-verdict
    enforcers: [src/gates/report.ts#gateReport, src/gates/state.ts#gateRuns, test/unit/gates/gates.test.ts]
  - id: gate-explicit-budget
    enforcers: [src/gates/workflow.ts#GateWorkflow, src/gates/state.ts#gateRuns, test/unit/gates/gates.test.ts]
  - id: gate-observe-only
    enforcers: [src/gates/snapshot.ts#workspaceSnapshot, src/gates/workflow.ts#GateWorkflow, test/unit/gates/gates.test.ts]
  - id: worktree-owned-provisioning
    enforcers: [src/worktrees/manager.ts#WorktreeManager, src/worktrees/contracts.ts#worktreeRecords, test/unit/worktrees/worktrees.test.ts]
  - id: worktree-safe-cleanup
    enforcers: [src/worktrees/manager.ts#WorktreeManager, test/unit/worktrees/worktrees.test.ts]
  - id: worktree-port-leases
    enforcers: [src/worktrees/contracts.ts#allocatePorts, test/unit/worktrees/worktrees.test.ts]
  - id: slice-testable-outcome
    enforcers: [src/slices/contract.ts#validateSlice, src/slices/contract.ts#checkSlicePlan, test/unit/slices/slices.test.ts]
  - id: slice-contract-first-parts
    enforcers: [src/slices/publish.ts#publishSlices, test/unit/slices/slices.test.ts]
  - id: slice-atomic-dependencies
    enforcers: [src/slices/publish.ts#publishSlices, src/slices/routing.ts, src/utilities/next.ts, test/unit/slices/slices.test.ts]
  - id: source-explicit-unknowns
    enforcers: [src/providers/manifest.ts#validateProvider, src/providers/sources.ts#querySource, test/unit/providers/sources.test.ts]
  - id: postgresql-read-only-query
    enforcers: [src/providers/postgresql.ts#readOnlyStatement, src/providers/postgresql.ts#PostgreSqlSource, test/unit/providers/sources.test.ts]
  - id: docs-same-operation-read
    enforcers: [src/providers/operations.ts#updateDocument, src/providers/manifest.ts#validateProvider, test/unit/providers/destinations.test.ts]
  - id: repo-docs-contained-output
    enforcers: [src/providers/repo-docs.ts#RepositoryDocuments, test/unit/providers/destinations.test.ts]
  - id: definition-fixed-coverage
    enforcers: [src/definition/challenge.ts#challengePlan, test/unit/definition/definition.test.ts]
  - id: definition-structural-contradictions
    enforcers: [src/definition/criteria.ts#lintCriteria, src/spec/contract.ts#checkSpec, test/unit/definition/definition.test.ts]
  - id: scope-metric-coverage
    enforcers: [src/scopes/contract.ts#checkScopePlan, test/unit/scopes/scopes.test.ts]
  - id: scope-stable-publication
    enforcers: [src/scopes/publish.ts#publishScopes, test/unit/scopes/scopes.test.ts]
  - id: scope-parent-approval
    enforcers: [src/flow/plan.ts#decisionTrail, src/flow/engine.ts, test/unit/scopes/scopes.test.ts]
  - id: spec-testable-definition
    enforcers: [src/spec/contract.ts#checkSpec, test/unit/spec/spec.test.ts]
  - id: spec-pinned-measurement
    enforcers: [src/spec/schemas/spec-v1.json, src/spec/contract.ts, test/unit/spec/spec.test.ts]
  - id: spec-human-approval
    enforcers: [src/flow/engine.ts#decide, src/flow/plan.ts#decisions, test/unit/spec/spec.test.ts]
  - id: framing-explicit-unknowns
    enforcers: [src/framing/contract.ts#checkFrame, src/flow/registry.ts, test/unit/framing/framing.test.ts]
  - id: framing-safe-identity
    enforcers: [src/framing/contract.ts#framingMatches, test/unit/framing/framing.test.ts]
  - id: framing-argued-no-go
    enforcers: [src/framing/contract.ts#validateFrameOutcome, src/flow/engine.ts, test/unit/framing/framing.test.ts]
  - id: research-source-coverage
    enforcers: [src/research/plan.ts#researchPlan, test/unit/research/research.test.ts]
  - id: research-active-refutations
    enforcers: [src/research/report.ts#researchReport, test/unit/research/research.test.ts]
  - id: research-journaled-brief
    enforcers: [src/flow/engine.ts#researchBrief, test/unit/research/research.test.ts]
  - id: missing-input-blocks-mutation
    enforcers: [src/flow/engine.ts#begin, test/unit/utilities/utilities.test.ts]
  - id: external-runtime-state
    enforcers: [src/state/paths.ts#assertExternal, test/unit/state/store.test.ts]
  - id: recorded-step-skips
    enforcers: [src/flow/engine.ts#skip, test/unit/flow/engine.test.ts]
  - id: required-human-decisions
    enforcers: [src/flow/plan.ts#decisions, test/unit/flow/engine.test.ts]
  - id: profile-preserves-coverage
    enforcers: [test/unit/profile/profile.test.ts]
  - id: history-without-tool-attribution
    enforcers: [src/git/commit.ts#checkCommit, test/unit/git/hook.test.ts]
documentation_only: []
